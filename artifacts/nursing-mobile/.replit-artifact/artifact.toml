kind = "mobile"
previewPath = "/mobile/"
title = "Nursing AI Mobile"
version = "1.0.0"
id = "artifacts/nursing-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 24752

[services.development]
run = "pnpm --filter @workspace/nursing-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nursing-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/nursing-mobile", "run", "serve" ]

[services.env]
PORT = "24752"
BASE_PATH = "/mobile/"
