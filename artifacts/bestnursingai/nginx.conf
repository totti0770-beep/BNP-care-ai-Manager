upstream api_server {
    server api-server:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded clinical PDFs are capped at 50 MB by the engine.
    client_max_body_size 52m;

    # Both go to the API server. /bnp-api is its gateway to the clinical engine,
    # which is never exposed directly — that is what keeps every engine request
    # attributable to a signed-in nurse.
    location /api/ {
        proxy_pass http://api_server;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /bnp-api/ {
        proxy_pass http://api_server;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Document upload chunks and embeds synchronously.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Hashed assets are immutable; index.html must never be cached or clients
    # pin to a stale bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
